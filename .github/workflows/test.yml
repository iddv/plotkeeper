# ci: install Plotkeeper the way the README says and run every test suite.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Plotkeeper has no dependencies beyond Python; pytest is only needed for the acceptance tests.
      - name: Install test tools
        run: python -m pip install pytest==8.3.3
      - name: Unit tests
        run: ./plotkeeper.sh test
      - name: Acceptance tests
        run: |
          if [ -d tests/acceptance ]; then python -m pytest tests/acceptance; else echo "no tests/acceptance"; fi
